# render.yaml
services:
  - type: web
    name: llm-hub-bot
    runtime: python
    repo: https://github.com/rahmetovtamerlan102-debug/Pro
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: llm-hub-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: llm-hub-redis
          property: connectionString
      - key: ADMIN_IDS
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: CRYPTOBOT_TOKEN
        sync: false
      - key: CRYPTOBOT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
    healthCheckPath: /health
    numInstances: 1
    plan: starter

databases:
  - name: llm-hub-db
    plan: starter
    databaseName: llmhub
    ipAllowList: []

  - name: llm-hub-redis
    plan: starter
    ipAllowList: []
